name: EnergyPilot
version: "0.11.3"
slug: energypilot
description: >-
  Energiemanager für PV, Batterie und dynamischen Strompreis – vergleicht
  PV-Prognosen mit der echten Erzeugung, lernt daraus und plant den Akku.
url: https://github.com/Telo87/ha-energypilot
# Nach dem ersten veröffentlichten Release (Workflow "Build") und nachdem das
# Paket auf GitHub öffentlich gestellt wurde, einkommentieren:
# image: ghcr.io/telo87/energypilot
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:solar-power-variant
panel_title: EnergyPilot
homeassistant_api: true
# Direktzugriff ohne Home Assistant (z. B. als App auf dem Handy): standardmäßig aus.
# Aktiv erst, wenn hier ein Port freigegeben UND unten ein Passwort gesetzt ist.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direktzugriff ohne Home Assistant (nur mit Passwort)
options:
  publish_sensors: true
  log_level: info
  direct_password: ""
schema:
  publish_sensors: bool
  log_level: list(debug|info|warning|error)
  direct_password: password?
