<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EnergyPilot – Anmelden</title>
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="static/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EnergyPilot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <style>
    :root { --bg: #f3f5f9; --surface: #fff; --border: #e2e8f0; --text: #0f172a; --text-2: #475569; --accent: #2563eb; --err: #dc2626; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --surface: #111a2c; --border: #22304b; --text: #e7ecf6; --text-2: #a7b3c9; --accent: #5b8cff; --err: #f87171; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px; background: var(--bg); color: var(--text);
      font: 15px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px 24px; text-align: center;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .12); animation: pop .35s cubic-bezier(.2, .7, .2, 1) backwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
    @media (prefers-reduced-motion: reduce) { form { animation: none; } }
    img { width: 64px; height: 64px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 14px 0 2px; letter-spacing: -.01em; }
    p { margin: 0 0 18px; color: var(--text-2); font-size: 13.5px; }
    p.err { color: var(--err); margin: 12px 0 0; font-weight: 550; }
    input { width: 100%; font: inherit; font-size: 16px; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    button { width: 100%; margin-top: 12px; font: inherit; font-weight: 650; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
    button:active { transform: scale(.98); }
    small { display: block; margin-top: 16px; color: var(--text-2); font-size: 11.5px; }
  </style>
</head>
<body>
  <form method="post" action="login" autocomplete="on">
    <img src="static/icon-180.png" alt="">
    <h1>EnergyPilot</h1>
    <p>Bitte mit dem Passwort für den Direktzugriff anmelden.</p>
    <input type="password" name="password" placeholder="Passwort" autocomplete="current-password" autofocus required aria-label="Passwort">
    <button type="submit">Anmelden</button>
    {{ERROR}}
    <small>v{{VERSION}}</small>
  </form>
</body>
</html>
