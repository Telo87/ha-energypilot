<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EnergyPilot</title>
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <!-- "Zum Home-Bildschirm": starts full screen like an app (direct access, see DOCS) -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="static/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EnergyPilot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="static/app.css?v={{VERSION}}">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="static/favicon.svg" alt="" class="brand-logo">
        <div>
          <div class="brand-name">EnergyPilot</div>
          <div class="brand-sub">v{{VERSION}}</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <a class="theme-toggle" id="feedbackLink" href="https://github.com/Telo87/ha-energypilot/issues" target="_blank" rel="noopener noreferrer" title="Fehler melden oder Idee vorschlagen (GitHub)"></a>
        <button class="theme-toggle" id="themeToggle" title="Design umschalten"></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü"></button>
        <div class="topbar-title">
          <h1 id="pageTitle">Übersicht</h1>
          <div class="topbar-sub" id="pageSub"></div>
        </div>
        <div class="topbar-actions" id="pageActions"></div>
      </header>
      <section class="content" id="content"></section>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Hauptseiten"></nav>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="toasts" id="toasts"></div>
  <div id="modalRoot"></div>
  <script src="static/app.js?v={{VERSION}}"></script>
</body>
</html>
